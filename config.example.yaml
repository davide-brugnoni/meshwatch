# MeshWatch — configurazione
# Copia questo file in config.yaml e modificalo.

# Radio gateway: qualsiasi scheda MeshCore col firmware "Companion USB"
# (Heltec V3/V4, RAK4631/WisMesh, LilyGO T-Beam/T-Echo/T-Deck, XIAO, Station G2, ...).
# "auto" trova la porta da sola e, se ci sono più dispositivi USB, li prova uno
# per uno finché trova quello che risponde. Per fissarla: ls /dev/serial/by-id/
serial_port: auto
baudrate: 115200

# In alternativa, una radio col firmware "Companion WiFi" raggiungibile in rete:
# connection: wifi
# wifi_host: 192.168.1.50
# wifi_port: 5000

# ---------------------------------------------------------------------------
# Dispositivi da seguire, ripetitori e utenti si gestiscono dalla pagina web
# (scheda Gestione). Le due sezioni qui sotto servono solo al PRIMO avvio:
# vengono importate una volta, poi le modifiche si fanno dalla pagina.
# Puoi anche lasciarle vuote e aggiungere tutto dalla pagina.
# ---------------------------------------------------------------------------

# Dispositivo da seguire (es. un SenseCAP T1000-E).
# "name" deve essere identico al nome del contatto MeshCore.
tracker:
  name: "Tracker-1"
  interval_min: 30          # ogni quanto chiedere la posizione
  active_hours: "05:00-21:00"   # fuori da questa fascia non interroga (vuoto = sempre)
  offline_alert_min: 90     # avviso se non risponde da più di X minuti
  low_battery_v: 3.5        # avviso batteria bassa (volt)

# Ripetitori da monitorare (password admin o guest del ripetitore).
# Ogni quanto interrogarli e la soglia batteria restano invece qui.
repeaters:
  - name: "Ripetitore-Nord"
    password: "cambiami"
  - name: "Ripetitore-Casa"
    password: "cambiami"
repeater_interval_min: 60
repeater_low_battery_v: 3.4   # anche per la previsione della batteria (scheda Statistiche)

telegram:
  token: "123456:ABC-il-token-di-BotFather"
  # Solo queste chat possono usare il bot e ricevono gli avvisi.
  # Il tuo ID lo scopri scrivendo /start al bot: te lo risponde lui.
  allowed_chat_ids: []
  # Chi può gestire: terminale, pausa, intervallo, advert, aggiornamento del programma
  # e del firmware, riepilogo automatico. Le altre chat vedono (posizione, mappa, /rete, ...).
  # Vuoto = tutte le chat autorizzate. Una chat admin è anche autorizzata.
  admin_chat_ids: []
  # Solo per i gruppi tra le chat admin: gli utenti (ID personale) che possono gestire.
  # Vale anche chi ha la propria chat privata in admin_chat_ids; gli altri membri vedono soltanto.
  admin_user_ids: []
  # Riepilogo della giornata con la mappa, ogni giorno a quest'ora (facoltativo).
  # Si cambia anche dal bot: /riepilogo 21:00 oppure /riepilogo no
  # daily_report: "21:00"
  # Avvisi per i nodi nuovi e spariti, riepilogo e backup si regolano dalla pagina
  # (Gestione → Telegram).

web:
  # "lan": pagina raggiungibile solo in casa (http://IP-raspberry:8080)
  # "public": dietro Cloudflare Tunnel (vedi README) — login obbligatorio
  mode: lan
  host: 0.0.0.0             # in modalità public metti 127.0.0.1
  port: 8080
  # La Gestione chiede sempre la password admin: si imposta al primo accesso
  # a Gestione. Altri utenti (admin o viewer) si creano dalla pagina.
  # Mappa visibile senza login (sola lettura). Vuoto = sì in lan, no in public.
  # public_map: true

database: meshwatch.db

# Dashboard pubblica: invio delle sole statistiche della rete a un sito esterno.
# Si configura dalla pagina (Gestione → Dashboard); questi sono solo i valori di partenza.
# publish:
#   url: https://tuosito.it/api/meshwatch
#   token: "una-stringa-lunga-e-casuale"
#   interval_min: 15        # minimo 5
#   grid_m: 500             # posizione dei ripetitori approssimata (0 = non pubblicarla)
#   companions: false       # elencare anche i companion (mai la posizione)
#   title: "Rete MeshCore"

# Aggiornamento dalla pagina (Gestione → Sistema → Aggiornamento programma).
# Facoltativo: di solito non serve toccarlo.
# update:
#   repo: davide-brugnoni/meshwatch
#   branch: main
#   notify: true    # avviso su Telegram quando esce una nuova versione (controllo ogni 12 ore)
