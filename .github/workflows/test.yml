# Test automatici a ogni push e pull request: se qualcosa si rompe, lo vedi qui
# prima che l'aggiornamento arrivi al Raspberry.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = DietPi / Raspberry Pi OS Bookworm, 3.13 = versione recente
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Librerie
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt httpx pyflakes

      - name: Il codice compila
        run: python -m compileall -q meshwatch tests

      - name: Controllo errori (pyflakes)
        run: python -m pyflakes meshwatch tests

      - name: Test di base
        run: python tests/test_smoke.py

      - name: Test chat, rubrica e mappa della rete
        run: python tests/test_chat.py

      - name: Test aggiornamento dalla pagina
        run: python tests/test_update.py

      - name: Test sensori, percorsi, copertura, tempo reale e bot
        run: python tests/test_features.py

      - name: Cache delle mappe
        run: python tests/test_tiles.py

      - name: Permessi di tutti gli endpoint per ogni ruolo
        run: python tests/test_permissions.py

  pagina-e-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pagina web (file inclusi, id, sintassi JavaScript)
        run: python3 tests/check_page.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Browser per il test della pagina
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Pagina in un browser vero (computer, telefono, tutte le schede)
        run: python tests/test_page_browser.py

      - name: Script di shell senza errori di sintassi
        run: for f in install.sh tools/*.sh sd-kit/*.sh; do bash -n "$f" && echo "ok $f"; done
